heading: The short version.
paragraphs:
  - I am a researcher in the field of f-block chemistry, specializing in the synthesis of lanthanide complexes. My experience includes lanthanide separation and complexation in ionic liquid media, with a strong focus on solvent effects, coordination behavior, and extraction chemistry.
  - My research interests encompass f-block bonding and reactivity, as well as applications in nuclear and separation chemistry.
