# =============================================================================
# The CMS at /admin/. This file describes the forms you see when you log in.
# Add a field here and a new box appears in the editor.
#
# Field types used below:
#   string  one-line box      text    multi-line box
#   markdown rich text        image   picks from the media library
#   select  dropdown          datetime  date picker
#   list    repeatable rows
# =============================================================================

backend:
  name: github
  repo: nagaraditya2531/nagaraditya2531.github.io   # change if you rename the repo
  branch: main


# Where the CMS puts anything you upload.
media_folder: "src/assets/uploads"
public_folder: "/assets/uploads"

collections:

  # ---------------------------------------------------------------- papers
  - name: papers
    label: Publications
    label_singular: Publication
    folder: "src/content/papers"
    create: true
    slug: "{{slug}}"
    summary: "{{year}} — {{title}}"
    fields:
      - { name: title,   label: Title, widget: string, required: false }
      - { name: date,    label: Date,  widget: datetime, required: false }
      - { name: year,    label: Year,  widget: number, value_type: int, required: false }
      - { name: authors, label: Authors, widget: string, required: false, hint: "As they appear on the paper" }
      - { name: journal, label: Journal, widget: string, required: false }
      - { name: doi,     label: DOI, widget: string, required: false, hint: "Just the 10.xxxx/... part" }
      - { name: pdf,     label: PDF, widget: file, required: false }
      - { name: image,   label: "Thumbnail (graphical abstract, figure)", widget: image, required: false }
      - { name: data_url, label: Data link, widget: string, required: false }
      - name: categories
        required: false
        label: Categories
        widget: relation
        collection: categories
        value_field: "{{slug}}"
        search_fields: [label]
        display_fields: [label]
        multiple: true
        hint: "Optional. Tag with as many as apply — this is what sub-menus filter on."
      - name: visibility
        required: false
        label: Visibility
        widget: select
        default: public
        options:
          - { label: "Public — shown everywhere", value: public }
          - { label: "Unlisted — has a link, not in any list", value: unlisted }
          - { label: "Draft — not on the site at all", value: draft }
      # ---- Abstract: use this when you don't want to write the long version ----
      - name: abstract
        label: Abstract
        widget: text
        required: false
        hint: "Paste the published abstract. Fine on its own — everything below is optional."

      # ---- The five questions. All optional. Fill in as many as you feel like. ----
      - { name: problem,      label: "The problem",     widget: text, required: false }
      - { name: mattered,     label: "Why it mattered", widget: text, required: false }
      - { name: found,        label: "What we found",   widget: text, required: false }
      - { name: contribution, label: "My contribution", widget: text, required: false }
      - { name: next,         label: "What's next",     widget: text, required: false }
      - { name: bibtex,       label: BibTeX, widget: text, required: false }
      - { name: body,         label: "Anything else", widget: markdown, required: false }

  # --------------------------------------------------------------- writing
  - name: writing
    label: "Notebook — essays"
    label_singular: Essay
    folder: "src/content/writing"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title,   label: Title, widget: string, required: false }
      - { name: date,    label: Date, widget: datetime, required: false }
      - { name: summary, label: One-line summary, widget: string, required: false }
      - { name: image,   label: Thumbnail, widget: image, required: false }
      - name: categories
        required: false
        label: Categories
        widget: relation
        collection: categories
        value_field: "{{slug}}"
        search_fields: [label]
        display_fields: [label]
        multiple: true
        hint: "Optional. Tag with as many as apply — this is what sub-menus filter on."
      - name: visibility
        label: Visibility
        widget: select
        required: false
        default: public
        options:
          - { label: "Public", value: public }
          - { label: "Unlisted", value: unlisted }
          - { label: "Draft", value: draft }
      - { name: body, label: Text, widget: markdown, required: false }

  # --------------------------------------------------------------- reading
  - name: reading
    label: "Notebook — reading"
    label_singular: Reading note
    folder: "src/content/reading"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title,  label: Title, widget: string, required: false }
      - { name: author, label: Author, widget: string, required: false }
      - { name: date,   label: Finished, widget: datetime, required: false }
      - name: kind
        label: Kind
        widget: select
        required: false
        options: [book, paper]
        default: book
      - { name: cover, label: "Cover image", widget: image, required: false }
      - { name: note, label: "One honest line", widget: text, required: false }
      - name: categories
        required: false
        label: Categories
        widget: relation
        collection: categories
        value_field: "{{slug}}"
        search_fields: [label]
        display_fields: [label]
        multiple: true
        hint: "Optional. Tag with as many as apply — this is what sub-menus filter on."
      - name: visibility
        required: false
        label: Visibility
        widget: select
        default: public
        options:
          - { label: "Public", value: public }
          - { label: "Draft", value: draft }

  # ------------------------------------------------------------- categories
  # The shared vocabulary. Anything can be tagged with these, and each one
  # gets a listing at /topics/<name>/ automatically. Renaming one changes
  # only that listing's address — no paper, essay or talk ever moves.
  - name: categories
    label: Categories
    label_singular: Category
    folder: "src/content/categories"
    create: true
    slug: "{{slug}}"
    summary: "{{label}}"
    fields:
      - { name: label, label: "Name shown on the site", widget: string, required: false }
      - { name: description, label: "One-line description", widget: text, required: false }
      - name: visibility
        required: false
        label: Visibility
        widget: select
        default: public
        options:
          - { label: "Public", value: public }
          - { label: "Draft — hidden", value: draft }

  # ------------------------------------------------------------------ pages
  # Free-standing pages. Make one, then point a menu or sub-menu item at it.
  # This is how you add a page without touching any code.
  - name: pages
    label: Pages
    label_singular: Page
    folder: "src/content/pages"
    create: true
    slug: "{{slug}}"
    summary: "{{title}}"
    fields:
      - { name: title, label: Title, widget: string, required: false }
      - name: slug
        required: false
        label: "Address"
        widget: string
        hint: "One word, no slashes. Typing 'teaching' gives you /teaching/. Never change it once linked."
      - { name: eyebrow, label: "Small label above the title", widget: string, required: false }
      - { name: standfirst, label: "One-line intro", widget: string, required: false }
      - name: categories
        required: false
        label: Categories
        widget: relation
        collection: categories
        value_field: "{{slug}}"
        search_fields: [label]
        display_fields: [label]
        multiple: true
      - name: visibility
        required: false
        label: Visibility
        widget: select
        default: public
        options:
          - { label: "Public", value: public }
          - { label: "Unlisted", value: unlisted }
          - { label: "Draft", value: draft }
      - { name: body, label: Content, widget: markdown, required: false }

  # ----------------------------------------------------------- conferences
  - name: conferences
    label: Conferences
    label_singular: Conference
    folder: "src/content/conferences"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title,   label: "Talk or poster title", widget: string, required: false }
      - { name: event,   label: "Conference name", widget: string, required: false }
      - { name: where,   label: "City, Country", widget: string, required: false }
      - { name: date,    label: Date, widget: datetime, required: false }
      - name: role
        label: What you did
        widget: select
        required: false
        options: [Talk, Poster, Attended, Invited talk, Workshop]
        default: Poster
      - { name: photo,   label: Photo, widget: image, required: false }
      - { name: summary, label: One-line summary, widget: string, required: false }
      - name: categories
        required: false
        label: Categories
        widget: relation
        collection: categories
        value_field: "{{slug}}"
        search_fields: [label]
        display_fields: [label]
        multiple: true
        hint: "Optional. Tag with as many as apply — this is what sub-menus filter on."
      - name: visibility
        required: false
        label: Visibility
        widget: select
        default: public
        options:
          - { label: "Public", value: public }
          - { label: "Unlisted", value: unlisted }
          - { label: "Draft", value: draft }
      - { name: body, label: Notes, widget: markdown, required: false }

  # --------------------------------------------------------------- detours
  - name: detours
    label: Detours
    label_singular: Detour
    folder: "src/content/detours"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title,   label: Title, widget: string, hint: "Not just the place name", required: false }
      - { name: where,   label: "City, Country", widget: string, required: false }
      - { name: date,    label: Date, widget: datetime, required: false }
      - { name: photo,   label: Photo, widget: image, required: false }
      - { name: summary, label: One-line summary, widget: string, required: false }
      - name: categories
        required: false
        label: Categories
        widget: relation
        collection: categories
        value_field: "{{slug}}"
        search_fields: [label]
        display_fields: [label]
        multiple: true
        hint: "Optional. Tag with as many as apply — this is what sub-menus filter on."
      - name: visibility
        label: Visibility
        widget: select
        required: false
        default: public
        options:
          - { label: "Public", value: public }
          - { label: "Unlisted", value: unlisted }
          - { label: "Draft", value: draft }
      - { name: body, label: Text, widget: markdown, required: false }

  # -------------------------------------------------------------- chapters
  - name: chapters
    label: Research areas
    label_singular: Area
    folder: "src/content/chapters"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title,   label: Name, widget: string, required: false }
      - { name: started, label: Start year, widget: number, value_type: int, required: false }
      - { name: span,    label: "Shown as", widget: string, hint: "e.g. 2024 — present", required: false }
      - name: status
        label: Status
        widget: select
        required: false
        options: [active, past]
        default: active
      - { name: summary, label: Summary, widget: text, required: false }
      - { name: meta,    label: "Small print", widget: string, required: false }
      - { name: image,   label: Image, widget: image, required: false }
      - name: categories
        required: false
        label: Categories
        widget: relation
        collection: categories
        value_field: "{{slug}}"
        search_fields: [label]
        display_fields: [label]
        multiple: true
        hint: "Optional. Tag with as many as apply — this is what sub-menus filter on."
      - name: visibility
        required: false
        label: Visibility
        widget: select
        default: public
        options:
          - { label: "Public", value: public }
          - { label: "Draft", value: draft }

  # -------------------------------------------------------- settings files
  - name: settings
    label: Settings
    files:
      - name: publish
        required: false
        label: "▶ Publish site"
        file: "src/_data/publish.yaml"
        fields:
          - name: last_published
            required: false
            label: "Publish everything saved so far"
            widget: datetime
            hint: "Change this to today and press Publish. That is what makes your saved changes go live."
          - { name: note, label: "What changed (optional, for your own records)", widget: string, required: false }

      - name: pagetext
        required: false
        label: "Page text — all fixed wording"
        file: "src/_data/pagetext.yaml"
        fields:
          - name: home
            required: false
            label: "Home page"
            widget: object
            fields:
              - { name: eyebrow, label: "Small label at the top", widget: string, required: false, hint: "Leave blank to use your tagline and location" }
              - { name: heading, label: "Big opening line", widget: text, required: false }
              - { name: intro, label: "Paragraph under it", widget: text, required: false }
              - { name: recent_heading, label: "'Recently' heading", widget: string, required: false }
              - { name: recent_link, label: "Link beside it", widget: string, required: false }
              - { name: questions_heading, label: "Questions heading", widget: string, required: false }
              - { name: questions_link, label: "Link beside it", widget: string, required: false }
              - { name: personal_heading, label: "Personal section heading", widget: string, required: false }
              - { name: personal_text, label: "Personal section text", widget: text, required: false }

          - name: research
            required: false
            label: "Research page"
            widget: object
            fields:
              - { name: eyebrow, label: "Small label", widget: string, required: false }
              - { name: heading, label: Heading, widget: text, required: false }
              - { name: intro, label: Intro, widget: text, required: false }
              - { name: questions_heading, label: "Questions heading", widget: string, required: false }

          - name: publications
            required: false
            label: "Publications page"
            widget: object
            fields:
              - { name: eyebrow, label: "Small label", widget: string, required: false }
              - { name: heading, label: Heading, widget: text, required: false }
              - { name: intro, label: Intro, widget: text, required: false }

          - name: notebook
            required: false
            label: "Notebook page"
            widget: object
            fields:
              - { name: eyebrow, label: "Small label", widget: string, required: false }
              - { name: heading, label: Heading, widget: text, required: false }
              - { name: intro, label: Intro, widget: text, required: false }

          - name: conferences
            required: false
            label: "Conferences page"
            widget: object
            fields:
              - { name: eyebrow, label: "Small label", widget: string, required: false }
              - { name: heading, label: Heading, widget: text, required: false }
              - { name: intro, label: Intro, widget: text, required: false }

          - name: detours
            required: false
            label: "Detours page"
            widget: object
            fields:
              - { name: eyebrow, label: "Small label", widget: string, required: false }
              - { name: heading, label: Heading, widget: text, required: false }
              - { name: intro, label: Intro, widget: text, required: false }

          - name: about
            required: false
            label: "About page"
            widget: object
            fields:
              - { name: eyebrow, label: "Small label", widget: string, required: false }
              - { name: contact_label, label: "Contact label", widget: string, required: false }

          - name: topics
            required: false
            label: "Topic pages"
            widget: object
            fields:
              - { name: eyebrow, label: "Small label", widget: string, required: false }
              - { name: empty, label: "Message when nothing is tagged", widget: string, required: false }

          - name: footer
            required: false
            label: Footer
            widget: object
            fields:
              - { name: tagline, label: "Tagline", widget: string, required: false }
              - { name: updated_label, label: "'Last updated' wording", widget: string, required: false }

          - name: back_labels
            required: false
            label: "Back links"
            widget: object
            fields:
              - { name: publications, label: "On a paper page", widget: string, required: false }
              - { name: notebook, label: "On an essay page", widget: string, required: false }
              - { name: conferences, label: "On a conference page", widget: string, required: false }
              - { name: detours, label: "On a detour page", widget: string, required: false }

      - name: site
        label: "Site — name, menu, links"
        file: "src/_data/site.json"
        fields:
          - { name: name,     label: "Your full name (used by search engines)", widget: string, required: false }
          - { name: shortName, label: "First name", widget: string, required: false }
          - name: alternateNames
            label: "Other spellings of your name"
            widget: list
            field: { name: alt, label: Spelling, widget: string, required: false }
            required: false
            hint: "How your name appears on papers and profiles. Tells Google these are all you."

          - { name: tagline,  label: Tagline, widget: string, required: false }
          - { name: jobTitle, label: "Job title (e.g. Chemist)", widget: string, required: false }
          - { name: affiliation, label: Institution, widget: string, required: false }
          - { name: location, label: Location, widget: string, required: false }
          - { name: url, label: "Site address (no trailing slash)", widget: string, hint: "Change this when you attach a domain", required: false }
          - { name: email,    label: Email, widget: string, required: false }
          - { name: portrait, label: Portrait photo, widget: image, required: false }
          - { name: version,  label: Version number, widget: string, required: false }
          - name: nav
            required: false
            label: Menu
            widget: list
            hint: "The header and the footer both read this list."
            fields:
              - { name: label, label: Label, widget: string, required: false }
              - { name: url,   label: URL, widget: string, required: false }
              - name: subnav
                required: false
                label: "Show a sub-menu for this section?"
                widget: boolean
                default: false
                hint: "Off = nothing changes. On = the items below appear as a second row."
              - name: autoTopics
                required: false
                label: "List all topics automatically?"
                widget: boolean
                default: false
                hint: "On = every category you create appears here by itself, in alphabetical order. Nothing to maintain. Any hand-picked items below are added after them."
              - name: children
                required: false
                label: "Sub-menu items"
                widget: list
                hint: "Add as many as you like, drag to reorder. Ignored unless the switch above is on."
                fields:
                  - { name: label, label: Label, widget: string, required: false }
                  - name: mode
                    required: false
                    label: "What does this link to?"
                    widget: select
                    default: topic
                    options:
                      - { label: "A topic — lists everything tagged with it", value: topic }
                      - { label: "A page — any address you choose", value: page }
                  - name: topic
                    required: false
                    label: "Topic"
                    widget: relation
                    collection: categories
                    value_field: "{{slug}}"
                    search_fields: [label]
                    display_fields: [label]
                    hint: "Used when the mode above is 'A topic'."
                  - name: url
                    required: false
                    label: "Address"
                    widget: string
                    hint: "Used when the mode above is 'A page'. e.g. /teaching/"
          - name: links
            required: false
            label: Profile links
            widget: list
            fields:
              - { name: label, label: Label, widget: string, required: false }
              - { name: url,   label: URL, widget: string, required: false }
          - name: facts
            required: false
            label: About-page facts
            widget: list
            fields:
              - { name: key,   label: Label, widget: string, required: false }
              - { name: value, label: Value, widget: string, required: false }

      - name: now
        required: false
        label: "Now block"
        file: "src/_data/now.yaml"
        fields:
          - name: show
            required: false
            label: "Show the Now block on the home page?"
            widget: boolean
            default: true
          - { name: updated, label: "Updated (e.g. July 2026)", widget: string, required: false }
          - name: lines
            required: false
            label: Lines
            widget: list
            fields:
              - { name: label, label: Label, widget: string, required: false }
              - { name: text,  label: Text, widget: string, required: false }

      - name: about
        required: false
        label: "About page"
        file: "src/_data/about.yaml"
        fields:
          - { name: heading, label: Heading, widget: string, required: false }
          - name: paragraphs
            required: false
            label: Paragraphs
            widget: list
            field: { name: paragraph, label: Paragraph, widget: text, required: false }
            hint: "Add, remove or reorder freely."
          - { name: contact_heading, label: "Contact heading", widget: string, required: false }

      - name: questions
        required: false
        label: "Open questions"
        file: "src/_data/questions.yaml"
        fields:
          - name: questions
            required: false
            label: Questions
            widget: list
            fields:
              - { name: text, label: Question, widget: text, required: false }
              - name: state
                required: false
                label: State
                widget: select
                options: [open, active, closed]
                default: open
              - { name: answer_url, label: "Link to the answer", widget: string, required: false }
