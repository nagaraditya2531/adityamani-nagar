# =============================================================================
# Builds and publishes the site.
#
# HOW PUBLISHING WORKS
#
# Content changes do NOT go live on their own. Editing a paper, essay,
# conference or category in the CMS saves it to GitHub — safely stored and
# versioned — but the live site stays as it is.
#
# To publish everything you've saved:
#     CMS -> Settings -> Publish site -> change the date -> Publish
#
# That one file is not in `paths-ignore` below, so saving it triggers a build
# and the whole site goes live at once.
#
# Changes to templates, CSS or config still build immediately, because you
# almost always want those live straight away.
#
# TO GO BACK TO PUBLISHING INSTANTLY: delete the `paths-ignore` block.
# =============================================================================
name: Build and deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'src/content/**'          # papers, essays, conferences, categories…
      - 'src/assets/uploads/**'   # images added through the CMS
  workflow_dispatch:              # the "Run workflow" button, as a backstop

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
