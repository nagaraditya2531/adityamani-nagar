# =============================================================================
# This runs on GitHub every time anything is saved to the repository —
# including when you press Publish in the CMS. It builds the site and
# deploys it. You never run this yourself.
#
# If the site stops updating, look at the "Actions" tab of the repo.
# A red X there tells you what broke.
# =============================================================================
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you press "Run workflow" by hand

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
